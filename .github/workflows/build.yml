name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: onlinemod-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod and run tests
        run: gradle clean build --no-daemon

      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: OnlineMod-1.20.1-Forge
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
